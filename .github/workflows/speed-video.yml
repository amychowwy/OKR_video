name: Export 1.3x video (bright female voice)
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful original 150-second render run ID
        required: true
        default: '41794047518'
  push:
    branches: [main]
    paths:
      - 'delivery.json'
      - 'scripts/speed.mjs'
      - 'public/audio/**'
      - '.github/workflows/speed-video.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: okr-speed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libnspr4 libxfixes3 libpango-1.0-0 libcairo2 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
      - name: Fetch original verified render
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id || '41794047518' }}
          name: OKR_Self_Review_Explainer
          path: source-render
      - name: Prepare corrected target-completion scene
        run: |
          npm ci
          npx remotion browser ensure
          node scripts/render-target-scene.mjs
      - name: Accelerate video and narration, synchronize subtitles, validate
        run: node scripts/speed.mjs source-render/OKR_Self_Review_Explainer.mp4
      - name: Upload 1.3x bright female narration video
        uses: actions/upload-artifact@v4
        with:
          name: OKR_Self_Review_Explainer_1.3x_YOUNG_FEMALE
          retention-days: 30
          if-no-files-found: error
          path: |
            out/OKR_Self_Review_Explainer_1.3x_YOUNG_FEMALE.mp4
            out/OKR_Self_Review_Explainer_1.3x_YOUNG_FEMALE.srt
            out/speed-validation.json
